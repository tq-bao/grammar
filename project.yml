name: GrammarApp

options:
  bundleIdPrefix: local.grammar
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  # Logic thuần: diff, pipeline, engine. Không phụ thuộc AppKit/Accessibility.
  GrammarKit:
    type: framework
    platform: macOS
    sources:
      - path: GrammarKit
    dependencies:
      # Bản build sẵn của llama.cpp (scripts/fetch-llama.sh). Metal shader đã nhúng sẵn.
      - framework: Vendor/llama.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.grammar.GrammarKit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  GrammarApp:
    type: application
    platform: macOS
    sources:
      - path: GrammarApp
        excludes:
          - "Resources/Models"
      # Thư mục model (git-ignored) được copy nguyên vào app bundle.
      - path: GrammarApp/Resources/Models
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: GrammarKit
      - framework: Vendor/llama.xcframework
        embed: true
    info:
      path: GrammarApp/Info.plist
      properties:
        CFBundleDisplayName: Grammar
        LSUIElement: true
        NSAccessibilityUsageDescription: "Grammar đọc nội dung ô bạn đang gõ để kiểm tra ngữ pháp tiếng Anh ngay trên máy."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.grammar.GrammarApp
        PRODUCT_NAME: Grammar
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  GrammarAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GrammarAppTests
    dependencies:
      - target: GrammarKit
      - framework: Vendor/llama.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.grammar.GrammarAppTests
        GENERATE_INFOPLIST_FILE: YES

  GrammarBench:
    type: tool
    platform: macOS
    sources:
      - path: GrammarBench
    dependencies:
      - target: GrammarKit
        embed: false
      - framework: Vendor/llama.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.grammar.GrammarBench
        # Tool cần tìm GrammarKit.framework nằm cạnh nó trong build products.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path @executable_path/../Frameworks"

schemes:
  GrammarApp:
    build:
      targets:
        GrammarApp: all
        GrammarAppTests: [test]
    test:
      targets:
        - GrammarAppTests
  GrammarBench:
    build:
      targets:
        GrammarBench: all
    run:
      config: Release
